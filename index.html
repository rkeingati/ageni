<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ageni Hot Tub Cinema</title>
<meta name="description" content="Pick a November night and a tub at Ageni, Kiambu, then hold your slot on WhatsApp with a 30% deposit.">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style id="css">
/* Layout: single column. Hero with a tub diagram, grid of night cards, one booking card, a timeline, a FAQ, and an editor-only panel.
   Palette: pine-teal ground, steam teal for water, lantern copper for the one action colour. */
:root{
  --bg:#EEF3F1;--card:#F9FBFA;--ink:#102E2C;--muted:#4A6361;--line:#C9D7D3;
  --accent:#A44718;--accent-ink:#FFFFFF;--steam:#25675F;--ok:#1C6E45;--warn:#8F5200;--full:#8A2F2F;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B1B;--card:#132626;--ink:#E6EFEC;--muted:#9CB4AF;--line:#274543;
    --accent:#F0A15B;--accent-ink:#1A1006;--steam:#6FC2B9;--ok:#6FD39A;--warn:#E7B25A;--full:#E48C8C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B1B;--card:#132626;--ink:#E6EFEC;--muted:#9CB4AF;--line:#274543;
  --accent:#F0A15B;--accent-ink:#1A1006;--steam:#6FC2B9;--ok:#6FD39A;--warn:#E7B25A;--full:#E48C8C;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);}
*{box-sizing:border-box}
#app{max-width:1040px;margin-inline:auto;padding-inline:16px;padding-block:20px 56px;font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:56px}
#app section{min-width:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,7vw,3.7rem);font-weight:700}
h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:700}
p{margin:0}
a{color:inherit}
.eyebrow,.mono{font-family:var(--mono)}
.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem}
.brand span{color:var(--muted);font-weight:500}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero-copy .lead{font-size:1.1rem;max-width:34em;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 1rem var(--body);text-decoration:none;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.block{width:100%}

.photo{margin:0;min-width:0}
.photo img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.photo figcaption{margin-top:8px;font-size:.85rem;color:var(--muted)}
.photo.wide{max-width:720px;margin-bottom:22px}

.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.sec-head p{color:var(--muted);max-width:40em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.night{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.night.is-full{opacity:.92}
.night-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.when{display:flex;align-items:baseline;gap:8px}
.when .num{font-family:var(--display);font-weight:700;font-size:2.5rem;line-height:1}
.when .dm{display:flex;flex-direction:column;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.time{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.open{color:var(--warn)}.pill.full{color:var(--full)}
.tubs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tubs .sep{width:1px;height:26px;background:var(--line);margin-inline:6px}
.dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--steam);background:transparent;flex:none}
.dot.taken{background:var(--accent);border-color:var(--accent)}
.dot.priv{width:30px;height:30px}
.avail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.avail li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.avail .left{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.avail .gone{color:var(--full)}
.legend{margin-top:14px;font-size:.85rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend .dot{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;margin-right:6px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

.book{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field select,.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;width:100%}
.field select:focus,.field input:focus{border-color:var(--accent)}
.depline{font-size:.92rem;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.9rem;width:30px;height:30px;border-radius:50%;border:2px solid var(--steam);display:grid;place-items:center}
.steps b{display:block}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.timeline .t{font-family:var(--mono);font-size:.85rem;color:var(--steam);font-variant-numeric:tabular-nums}
.timeline b{display:block}

.circle{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.circle > div{max-width:40em;min-width:0;display:flex;flex-direction:column;gap:8px}

details{border-bottom:1px solid var(--line);padding:4px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--steam)}
details[open] summary::after{content:"\2212"}
details p{padding-bottom:14px;color:var(--muted);max-width:44em}

.foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:20px}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow .num{font-family:var(--mono);font-size:1.15rem;user-select:all}
.copy{font:500 .85rem var(--mono);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}

.admin{border:2px dashed var(--accent);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.admin h2{font-size:1.3rem}
.arow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step{display:inline-flex;align-items:center;gap:8px}
.step button,.tog{font:600 1rem var(--mono);width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.step .v{min-width:1.6em;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog{width:auto;padding-inline:12px;font-size:.85rem}
.alabel{font-size:.7rem;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;display:block}

@media (max-width:760px){
  #app{gap:44px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .book{grid-template-columns:minmax(0,1fr)}
  .arow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .arow > :first-child{grid-column:1 / -1}
  .timeline li{grid-template-columns:78px minmax(0,1fr);gap:12px}
}
</style>

function kes(n){return 'KES '+Number(n).toLocaleString('en-US');}
function parse(d){var p=d.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function label(d){var t=parse(d);return DOW[t.getUTCDay()]+' '+t.getUTCDate()+' '+MON[t.getUTCMonth()];}
function today(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function live(){var t=today();return draft.filter(function(x){return x.d>=t;});}
function total(x){return x.s+x.p;}
function isFull(x){return total(x)>=4;}
function status(x){
  if(isFull(x))return {k:'full',t:'Full'};
  if(total(x)>=MIN)return {k:'ok',t:'Running'};
  return {k:'open',t:'Needs '+(MIN-total(x))+' more'};
}
function dots(x){
  var h='';
  for(var i=0;i<3;i++)h+='<span class="dot'+(i<x.s?' taken':'')+'"></span>';
  h+='<span class="sep"></span><span class="dot priv'+(x.p?' taken':'')+'"></span>';
  return h;
}

    '<details><summary>Where is it?</summary><p>Ageni is on Kenyatta Road in Kiambu, about 30 to 40 minutes from Nairobi. We send a map pin on WhatsApp once your slot is confirmed.</p></details>'+
    '<details><summary>Do I share a tub with strangers?</summary><p>No. Every booking has its own tub. In the spa room three tubs sit side by side, and everyone watches the same screen. The private tub is on its own in the ground-floor bedroom.</p></details>'+
    '<details><summary>What happens if the night is cancelled?</summary><p>A night runs once '+MIN+' tubs are booked. If it has not reached that 72 hours before, we cancel and refund your deposit in full. The first dates also depend on our new equipment being installed, and we confirm each night with you on WhatsApp.</p></details>'+
    '<details><summary>Can I cancel my booking?</summary><p>Up to 72 hours before the night, you get your deposit back in full. After that the deposit is kept, because the tub has already been prepared for you.</p></details>'+
    '<details><summary>How is the water kept clean?</summary><p>Each tub is filled fresh for your group, sanitised, and drained afterwards.</p></details>'+
    '<details><summary>Which film do we watch?</summary><p>The group chooses the day before. Tell us on WhatsApp what you would like.</p></details>'+
    '<details><summary>Is it safe?</summary><p>No glass near the tubs. Soaks have a time limit with breaks, and a member of the Ageni team is on site for the whole night.</p></details>'+
    '<details><summary>Can we stay the night?</summary><p>Yes. Ask for a room when you message us and we will send the rate.</p></details>'+
    '<details><summary>What should I bring?</summary><p>Swimwear and something warm to wear afterwards.</p></details>'+
  '</section>'+

  '<section class="foot"><span class="eyebrow">Questions or a custom night</span><div class="numrow"><span class="num" id="num">'+SHOWN+'</span><button class="copy" id="copy" type="button">Copy number</button><a class="btn ghost" href="https://wa.me/'+WA+'" target="_blank" rel="noopener">Open WhatsApp</a></div><p class="muted">Ageni Suites, Kenyatta Road, Kiambu</p></section>'+

  '<section class="admin" id="admin" hidden><div><span class="eyebrow">Only people who can edit this page see this</span><h2>Update bookings</h2></div>'+
    '<p class="muted">Set how many tubs are booked for each night. Cards above update as you go. Press Save to publish for everyone.</p>'+
    '<div id="alist"></div><div class="actions"><button class="btn" id="save" type="button">Save to page</button></div><p id="amsg" class="muted" role="status"></p></section>';
}

function renderNights(){
  var g=live();
  $('upd').textContent='Availability updated '+label(state.updated);
  if(!g.length){$('grid').innerHTML='<div class="empty">No upcoming nights are listed right now. Message us on WhatsApp for the next dates.</div>';return;}
  $('grid').innerHTML=g.map(function(x){
    var st=status(x),t=parse(x.d);
    var sLeft=3-x.s,pLeft=1-x.p;
    return '<article class="night'+(isFull(x)?' is-full':'')+'">'+
      '<div class="night-top"><div class="when"><span class="num">'+t.getUTCDate()+'</span><span class="dm"><span>'+DOW[t.getUTCDay()]+'</span><span>'+MON[t.getUTCMonth()]+'</span></span></div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="pill '+st.k+'">'+st.t+'</span><span class="time">6:30 pm</span></div></div>'+
      '<div class="tubs" aria-hidden="true">'+dots(x)+'</div>'+
      '<ul class="avail"><li><span>Spa room tub <b>'+kes(PRICE.s)+'</b></span><span class="left'+(sLeft?'':' gone')+'">'+leftTxt(sLeft)+'</span></li>'+
      '<li><span>Private tub <b>'+kes(PRICE.p)+'</b></span><span class="left'+(pLeft?'':' gone')+'">'+leftTxt(pLeft)+'</span></li></ul>'+
      '<button class="btn block" type="button" data-book="'+x.id+'">'+(isFull(x)?'Join the waitlist':'Book this night')+'</button></article>';
  }).join('');
}

function renderOptions(){
  var g=live(),ns=$('f-night');
  if(!g.length){ns.innerHTML='<option value="">No nights listed</option>';sel.id=null;updateLink();return;}
  if(!sel.id||!g.some(function(x){return x.id===sel.id;})){
    var first=g.filter(function(x){return !isFull(x);})[0]||g[0];sel.id=first.id;
  }
  ns.innerHTML=g.map(function(x){
    return '<option value="'+x.id+'"'+(x.id===sel.id?' selected':'')+'>'+label(x.d)+' at 6:30 pm'+(isFull(x)?' (full, waitlist)':'')+'</option>';
  }).join('');
  var x=g.filter(function(y){return y.id===sel.id;})[0];
  var cur=$('f-slot').value||'s';
  $('f-slot').innerHTML=
    '<option value="s"'+(cur==='s'?' selected':'')+'>Spa room tub, '+kes(PRICE.s)+(x.s>=3?' (taken)':'')+'</option>'+
    '<option value="p"'+(cur==='p'?' selected':'')+'>Private tub, '+kes(PRICE.p)+(x.p>=1?' (taken)':'')+'</option>';
  updateLink();
}

function updateLink(){
  var a=$('go'),x=draft.filter(function(y){return y.id===sel.id;})[0];
  if(!x){a.removeAttribute('href');a.textContent='Book on WhatsApp';$('depline').textContent='';return;}
  var slot=$('f-slot').value||'s';
  var avail=slot==='s'?x.s<3:x.p<1;
  var price=PRICE[slot],dep=Math.round(price*DEP);
  var tub=slot==='s'?'a spa room tub':'the private tub';
  var name=$('f-name').value.trim();
  var msg=avail
    ?'Hi Ageni, I would like to book '+tub+' ('+kes(price)+') for the Hot Tub Cinema on '+label(x.d)+' at 6:30 pm.'+(name?' My name is '+name+'.':'')+' Please send the M-Pesa details for the 30% deposit ('+kes(dep)+').'
    :'Hi Ageni, '+tub+' on '+label(x.d)+' is taken. Please add me to the waitlist for that night.'+(name?' My name is '+name+'.':'');
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  a.textContent=avail?'Book on WhatsApp':'Join the waitlist on WhatsApp';
  $('depline').textContent=avail
    ?'Deposit to hold this slot: '+kes(dep)+' (30%). The balance is paid on the night.'
    :'This tub is taken for that night. Join the waitlist and we will message you if it opens up.';
}

function renderAdmin(){
  var h='';
  live().forEach(function(x){
    h+='<div class="arow"><b>'+label(x.d)+'</b>'+
      '<span class="step" data-id="'+x.id+'"><span><span class="alabel">Spa room booked</span></span>'+
      '<button type="button" data-a="s-" aria-label="One fewer spa room tub on '+label(x.d)+'">−</button>'+
      '<span class="v">'+x.s+'</span>'+
      '<button type="button" data-a="s+" aria-label="One more spa room tub on '+label(x.d)+'">+</button></span>'+
      '<button type="button" class="tog" data-a="p" data-id="'+x.id+'" aria-pressed="'+(x.p?'true':'false')+'">Private tub '+(x.p?'booked':'free')+'</button></div>';
  });
  $('alist').innerHTML=h;
}

function buildDoc(next){
  var css=$('css').textContent,code=$('code').textContent,font=$('fontlink').outerHTML;
  var json=JSON.stringify(next).replace(/</g,'\\u003c');
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+TITLE+'</title>\n'+font+'\n<style id="css">'+css+'</style>\n<div id="app"></div>\n'+
    '<script type="application/json" id="state">'+json+'</'+'script>\n'+
    '<script id="code">'+code+'</'+'script>\n</body></html>';
}

async function save(){
  var btn=$('save'),msg=$('amsg');
  btn.disabled=true;msg.textContent='Saving...';
  try{
    await artifactApi.publish(buildDoc({updated:today(),sessions:draft}));
    msg.textContent='Saved. The page is reloading.';
  }catch(e){
    var c=e&&e.code;
    msg.textContent=c==='conflict'?'Someone saved a newer version first. The page is reloading to it.':
      (c==='not_granted'||c==='not_writer')?'You can view this page but not save changes to it.':
      'Could not save. Try again in a moment.';
    btn.disabled=false;
  }
}

async function copyNum(){
  var b=$('copy');
  try{await navigator.clipboard.writeText(LOCAL);b.textContent='Copied';}
  catch(e){
    try{var r=document.createRange();r.selectNodeContents($('num'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, now copy';}
    catch(e2){b.textContent='Copy manually';}
  }
  setTimeout(function(){b.textContent='Copy number';},2200);
}

function wire(){
  $('circle').href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hi Ageni, please add me to the Ageni Circle list for the Hot Tub Cinema.');
  $('grid').addEventListener('click',function(e){
    var b=e.target.closest('[data-book]');if(!b)return;
    sel.id=b.getAttribute('data-book');
    var x=draft.filter(function(y){return y.id===sel.id;})[0];
    if(x&&x.s>=3&&x.p<1)$('f-slot').value='p';else if(x&&x.s<3)$('f-slot').value='s';
    renderOptions();
    $('book').scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){try{$('f-name').focus({preventScroll:true});}catch(e){}},400);
  });
  $('f-night').addEventListener('change',function(){sel.id=this.value;renderOptions();});
  $('f-slot').addEventListener('change',function(){renderOptions();});
  $('f-name').addEventListener('input',updateLink);
  $('copy').addEventListener('click',copyNum);
  $('alist').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    var host=b.closest('[data-id]'),id=host.getAttribute('data-id');
    var x=draft.filter(function(y){return y.id===id;})[0];if(!x)return;
    var a=b.getAttribute('data-a');
    if(a==='s+')x.s=Math.min(3,x.s+1);
    else if(a==='s-')x.s=Math.max(0,x.s-1);
    else if(a==='p')x.p=x.p?0:1;
    renderAdmin();renderNights();renderOptions();
  });
  $('save').addEventListener('click',save);
}

async function initAdmin(){
  try{
    if(!window.claude||!window.claude.use)return;
    var user=await window.claude.use('user');
    if(!user)return;
    var ok=await user.canEdit();
    if(!ok)return;
    artifactApi=await window.claude.use('artifact');
    if(!artifactApi)return;
    $('admin').hidden=false;renderAdmin();
  }catch(e){}
}

shell();wire();renderNights();renderOptions();initAdmin();
})();
</script>

</body>
</html>
